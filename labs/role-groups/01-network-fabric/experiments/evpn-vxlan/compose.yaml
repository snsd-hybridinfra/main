name: infra-evpn-vxlan-lab

x-router: &router
  network_mode: none
  cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
  sysctls:
    net.ipv4.ip_forward: "1"
  restart: "no"

x-host: &host
  image: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
  network_mode: none
  cap_add: [NET_ADMIN]
  command: ["sh", "-c", "sleep 999999"]

services:
  leaf1:
    <<: *router
    build:
      context: .
      dockerfile: Dockerfile.frr
      args: { ROUTER: leaf1 }
  leaf2:
    <<: *router
    build:
      context: .
      dockerfile: Dockerfile.frr
      args: { ROUTER: leaf2 }
  host1: { <<: *host }
  host2: { <<: *host }
  host3: { <<: *host }
  host4: { <<: *host }
