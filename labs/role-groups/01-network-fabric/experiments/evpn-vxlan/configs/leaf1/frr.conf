frr version 10.7
frr defaults traditional
hostname evpn-leaf1
service integrated-vtysh-config
!
router bgp 65200
 bgp router-id 10.255.1.1
 no bgp ebgp-requires-policy
 neighbor 10.202.0.2 remote-as 65200
 neighbor 10.202.0.2 timers 3 9
 !
 address-family ipv4 unicast
  network 10.255.1.1/32
  neighbor 10.202.0.2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.202.0.2 activate
  advertise-all-vni
 exit-address-family
!
