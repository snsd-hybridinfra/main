! Candidate for vEOS-lab 4.30.x
hostname leaf2
service routing protocols model multi-agent
ip routing
!
ip prefix-list FABRIC-LOOPBACKS seq 10 permit 192.0.2.1/32
ip prefix-list FABRIC-LOOPBACKS seq 20 permit 192.0.2.2/32
ip prefix-list FABRIC-LOOPBACKS seq 30 permit 192.0.2.11/32
ip prefix-list FABRIC-LOOPBACKS seq 40 permit 192.0.2.12/32
ip prefix-list SELF-LOOPBACK seq 10 permit 192.0.2.12/32
ip prefix-list TENANT-LOCAL seq 10 permit 198.51.100.128/26
!
interface Loopback0
 ip address 192.0.2.12/32
!
interface Ethernet1
 no switchport
 mtu 1600
 ip address 203.0.113.3/31
 no shutdown
!
interface Ethernet2
 no switchport
 mtu 1600
 ip address 203.0.113.7/31
 no shutdown
!
vrf instance TENANT
ip routing vrf TENANT
ip virtual-router mac-address 02:00:00:00:fe:01
!
vlan 10
!
interface Vlan10
 vrf TENANT
 ip address virtual 198.51.100.1/26
 no shutdown
!
vlan 30
!
interface Vlan30
 vrf TENANT
 ip address virtual 198.51.100.129/26
 no shutdown
!
interface Ethernet3
 switchport mode trunk
 switchport trunk allowed vlan 10,30
 no shutdown
!
interface Vxlan1
 vxlan source-interface Loopback0
 vxlan udp-port 4789
 vxlan vlan 10 vni 1010
 vxlan vlan 30 vni 1030
 vxlan vrf TENANT vni 50000
!
route-map TENANT-EXPORT permit 10
 match ip address prefix-list TENANT-LOCAL
!
router bgp 65102
 router-id 192.0.2.12
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 maximum-paths 2 ecmp 2
 bgp log-neighbor-changes
 neighbor 203.0.113.2 remote-as 65001
 neighbor 203.0.113.2 timers 2 6
 neighbor 203.0.113.6 remote-as 65002
 neighbor 203.0.113.6 timers 2 6
 neighbor 192.0.2.1 remote-as 65001
 neighbor 192.0.2.1 timers 2 6
 neighbor 192.0.2.2 remote-as 65002
 neighbor 192.0.2.2 timers 2 6
 neighbor 192.0.2.1 update-source Loopback0
 neighbor 192.0.2.1 ebgp-multihop 5
 neighbor 192.0.2.1 send-community extended
 neighbor 192.0.2.2 update-source Loopback0
 neighbor 192.0.2.2 ebgp-multihop 5
 neighbor 192.0.2.2 send-community extended
 vlan 10
  rd 192.0.2.12:1010
  route-target both 65000:1010
  redistribute learned
 !
 vlan 30
  rd 192.0.2.12:1030
  route-target both 65000:1030
  redistribute learned
 !
 address-family ipv4
  network 192.0.2.12/32
  neighbor 203.0.113.2 activate
  neighbor 203.0.113.2 prefix-list FABRIC-LOOPBACKS in
  neighbor 203.0.113.2 prefix-list SELF-LOOPBACK out
  neighbor 203.0.113.6 activate
  neighbor 203.0.113.6 prefix-list FABRIC-LOOPBACKS in
  neighbor 203.0.113.6 prefix-list SELF-LOOPBACK out
 !
 address-family evpn
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.2 activate
 !
 vrf TENANT
  rd 192.0.2.12:50000
  route-target import evpn 65000:50000
  route-target export evpn 65000:50000
  redistribute connected route-map TENANT-EXPORT
!
