! Candidate for vEOS-lab 4.30.x
hostname spine1
service routing protocols model multi-agent
ip routing
!
ip prefix-list FABRIC-LOOPBACKS seq 10 permit 192.0.2.1/32
ip prefix-list FABRIC-LOOPBACKS seq 20 permit 192.0.2.2/32
ip prefix-list FABRIC-LOOPBACKS seq 30 permit 192.0.2.11/32
ip prefix-list FABRIC-LOOPBACKS seq 40 permit 192.0.2.12/32
ip prefix-list SELF-LOOPBACK seq 10 permit 192.0.2.1/32
!
interface Loopback0
 ip address 192.0.2.1/32
!
interface Ethernet1
 no switchport
 mtu 1600
 ip address 203.0.113.0/31
 no shutdown
!
interface Ethernet2
 no switchport
 mtu 1600
 ip address 203.0.113.2/31
 no shutdown
!
router bgp 65001
 router-id 192.0.2.1
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 maximum-paths 2 ecmp 2
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 65101
 neighbor 203.0.113.1 timers 2 6
 neighbor 203.0.113.3 remote-as 65102
 neighbor 203.0.113.3 timers 2 6
 neighbor 192.0.2.11 remote-as 65101
 neighbor 192.0.2.11 timers 2 6
 neighbor 192.0.2.12 remote-as 65102
 neighbor 192.0.2.12 timers 2 6
 neighbor 192.0.2.11 update-source Loopback0
 neighbor 192.0.2.11 ebgp-multihop 5
 neighbor 192.0.2.11 send-community extended
 neighbor 192.0.2.11 next-hop-unchanged
 neighbor 192.0.2.12 update-source Loopback0
 neighbor 192.0.2.12 ebgp-multihop 5
 neighbor 192.0.2.12 send-community extended
 neighbor 192.0.2.12 next-hop-unchanged
 address-family ipv4
  network 192.0.2.1/32
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 prefix-list FABRIC-LOOPBACKS in
  neighbor 203.0.113.1 prefix-list FABRIC-LOOPBACKS out
  neighbor 203.0.113.3 activate
  neighbor 203.0.113.3 prefix-list FABRIC-LOOPBACKS in
  neighbor 203.0.113.3 prefix-list FABRIC-LOOPBACKS out
 !
 address-family evpn
  neighbor 192.0.2.11 activate
  neighbor 192.0.2.12 activate
!
