router bgp 65102
 bgp router-id 192.0.2.12
 no bgp default ipv4-unicast
 bgp ebgp-requires-policy
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor 203.0.113.2 remote-as 65001
 neighbor 203.0.113.2 timers 2 6
 neighbor 203.0.113.2 timers connect 2
 neighbor 203.0.113.6 remote-as 65002
 neighbor 203.0.113.6 timers 2 6
 neighbor 203.0.113.6 timers connect 2
 neighbor 192.0.2.1 remote-as 65001
 neighbor 192.0.2.1 timers 2 6
 neighbor 192.0.2.1 timers connect 2
 neighbor 192.0.2.2 remote-as 65002
 neighbor 192.0.2.2 timers 2 6
 neighbor 192.0.2.2 timers connect 2
 neighbor 192.0.2.1 update-source 192.0.2.12
 neighbor 192.0.2.1 ebgp-multihop 5
 neighbor 192.0.2.2 update-source 192.0.2.12
 neighbor 192.0.2.2 ebgp-multihop 5
 !
 address-family ipv4 unicast
  network 192.0.2.12/32
  maximum-paths 2
  neighbor 203.0.113.2 activate
  neighbor 203.0.113.2 prefix-list FABRIC-LOOPBACKS in
  neighbor 203.0.113.2 prefix-list SELF-LOOPBACK out
  neighbor 203.0.113.2 soft-reconfiguration inbound
  neighbor 203.0.113.6 activate
  neighbor 203.0.113.6 prefix-list FABRIC-LOOPBACKS in
  neighbor 203.0.113.6 prefix-list SELF-LOOPBACK out
  neighbor 203.0.113.6 soft-reconfiguration inbound
