!
vrf TENANT
 vni 50000
exit-vrf
!
router bgp 65102 vrf TENANT
 bgp router-id 192.0.2.12
 address-family ipv4 unicast
  redistribute connected route-map TENANT-EXPORT
 exit-address-family
 address-family l2vpn evpn
  rd 192.0.2.12:50000
  route-target import 65000:50000
  route-target export 65000:50000
  advertise ipv4 unicast
