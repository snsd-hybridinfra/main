 address-family l2vpn evpn
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.1 route-map EVPN-LAB in
  neighbor 192.0.2.1 route-map EVPN-LAB out
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map EVPN-LAB in
  neighbor 192.0.2.2 route-map EVPN-LAB out
  advertise-all-vni
  vni 1010
   rd 192.0.2.12:1010
   route-target import 65000:1010
   route-target export 65000:1010
  exit-vni
  vni 1030
   rd 192.0.2.12:1030
   route-target import 65000:1030
   route-target export 65000:1030
  exit-vni
