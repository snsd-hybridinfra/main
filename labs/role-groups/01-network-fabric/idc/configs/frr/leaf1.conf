router bgp 65101
 bgp router-id 192.0.2.11
 no bgp default ipv4-unicast
 bgp ebgp-requires-policy
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor 203.0.113.0 remote-as 65001
 neighbor 203.0.113.0 timers 2 6
 neighbor 203.0.113.0 timers connect 2
 neighbor 203.0.113.4 remote-as 65002
 neighbor 203.0.113.4 timers 2 6
 neighbor 203.0.113.4 timers connect 2
