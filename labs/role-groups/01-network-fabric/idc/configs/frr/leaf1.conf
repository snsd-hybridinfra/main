 neighbor 192.0.2.1 timers 2 6
 neighbor 192.0.2.1 timers connect 2
 neighbor 192.0.2.2 remote-as 65002
 neighbor 192.0.2.2 timers 2 6
 neighbor 192.0.2.2 timers connect 2
 neighbor 192.0.2.1 update-source 192.0.2.11
 neighbor 192.0.2.1 ebgp-multihop 5
 neighbor 192.0.2.2 update-source 192.0.2.11
 neighbor 192.0.2.2 ebgp-multihop 5
 !
 address-family ipv4 unicast
  network 192.0.2.11/32
  maximum-paths 2
  neighbor 203.0.113.0 activate
  neighbor 203.0.113.0 prefix-list FABRIC-LOOPBACKS in
  neighbor 203.0.113.0 prefix-list SELF-LOOPBACK out
  neighbor 203.0.113.0 soft-reconfiguration inbound
  neighbor 203.0.113.4 activate
  neighbor 203.0.113.4 prefix-list FABRIC-LOOPBACKS in
  neighbor 203.0.113.4 prefix-list SELF-LOOPBACK out
  neighbor 203.0.113.4 soft-reconfiguration inbound
