# NON-PRODUCTION EXAMPLE ONLY
# Symbolic placeholders are intentionally not deployable values.
# Response security headers are validated separately by retired-numbered-case.

upstream <upstream-name-placeholder> {
    server <backend-service>:<backend-service-port>;
}

server {
    listen 80;
    server_name <public-service-domain-placeholder>;

    location / {
        proxy_pass http://<upstream-name-placeholder>;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# Backend health path placeholder: <backend-health-path>
