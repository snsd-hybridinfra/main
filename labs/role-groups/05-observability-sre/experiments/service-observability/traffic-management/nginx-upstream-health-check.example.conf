# NON-PRODUCTION EXAMPLE ONLY
# Open-source Nginx passive upstream retry plus an explicit health endpoint.
# Nginx Plus active health checks and automatic backend removal are out of scope.

upstream <backend-pool-placeholder> {
    server <backend-service-a-placeholder>;
    server <backend-service-b-placeholder>;
}

server {
    listen 80;

    location /health {
        proxy_pass http://<backend-pool-placeholder>;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}

# Health interval placeholder: <health-check-interval>
# Unhealthy threshold placeholder: <unhealthy-threshold>
