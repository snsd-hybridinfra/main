apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: edge-system
  labels:
    app.kubernetes.io/name: edge-gateway
  annotations:
    zero-trust.snsd.local/exposure: approved-private-edge-only
    iaas.example.com/traffic-contract: "existing NLB TCP 443 -> node port 30443 -> pod 8443"
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: edge-gateway
  ports:
    - name: tls
      protocol: TCP
      port: 443
      targetPort: https
      nodePort: 30443
