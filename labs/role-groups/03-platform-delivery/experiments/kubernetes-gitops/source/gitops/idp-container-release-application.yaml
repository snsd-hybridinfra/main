apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-container-release
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/snsd-hybirdinfra/snsd-multicloud-ops.git
    targetRevision: main
    path: applications/internal-iaas-portal/kubernetes/releases
  destination:
    name: in-cluster
    namespace: control-service
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
