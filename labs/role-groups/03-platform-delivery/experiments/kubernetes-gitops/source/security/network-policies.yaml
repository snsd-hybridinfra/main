apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-allowed-ingress
  namespace: edge-system
  annotations:
    zero-trust.snsd.local/configuration-only: approved private ingress range
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - {protocol: TCP, port: 8443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-allowed-egress
  namespace: edge-system
  annotations:
    iaas.example.com/replace-cidr: On-Prem CIDR must be supplied by Zero Trust network owner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: user-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: user-portal
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: admin-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: admin-portal
      ports:
        - {protocol: TCP, port: 8081}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: user-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: request-api
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - ipBlock:
            cidr: 10.10.0.0/16
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8001}
        - {protocol: TCP, port: 8002}
---
