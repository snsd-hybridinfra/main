apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terraform-runner-egress
  namespace: control-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: terraform-runner
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: control-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: approval-api
      ports:
        - {protocol: TCP, port: 8001}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
