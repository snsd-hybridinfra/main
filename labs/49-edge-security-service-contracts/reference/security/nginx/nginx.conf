load_module modules/ngx_http_modsecurity_module.so;
load_module modules/ngx_http_headers_more_filter_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    more_clear_headers Server X-Powered-By;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1m;

    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    log_format edge_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","host":"$host","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

    access_log /dev/stdout edge_json;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=user_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=admin_api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=identity:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/setup.conf;

    include /tmp/edge.conf;
}
