---
- name: Stop ZT-VIS-002 while preserving reviewed data
  hosts: zt_vis_002
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    zt_vis_002_root: /opt/snsd-zt-vis-002
    zt_vis_002_container_runtime: /usr/bin/podman
    zt_vis_002_rollback_authorized: false
  tasks:
    - name: Require explicit rollback authorization
      ansible.builtin.assert:
        that:
          - zt_vis_002_rollback_authorized | bool
          - zt_vis_002_container_runtime == '/usr/bin/podman'
        fail_msg: Explicit bounded rollback authorization is required

    - name: Stop and remove only the ZT-VIS-002 containers and network
      ansible.builtin.command:
        argv:
          - "{{ zt_vis_002_container_runtime }}"
          - compose
          - --project-name
          - snsd-zt-vis-002
          - --file
          - "{{ zt_vis_002_root }}/compose.yaml"
          - down
      changed_when: true

    - name: Record preservation boundary without emitting runtime data
      ansible.builtin.debug:
        msg: Configuration, secrets, sanitized input, and persistent data are preserved pending separate deletion approval
