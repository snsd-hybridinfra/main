---
- name: Enforce reviewed host-bootstrap gates
  ansible.builtin.assert:
    that:
      - zt_vis_002_host_bootstrap_authorized | bool
      - zt_vis_002_restore_checkpoint_ready | bool
      - zt_vis_002_data_device is match('^/dev/[a-zA-Z0-9._/-]+$')
      - zt_vis_002_data_device_expected_size_gib | int >= 10
      - zt_vis_002_root == '/opt/snsd-zt-vis-002'
      - zt_vis_002_proxy_bind_address is match('^(10\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})$')
      - zt_vis_002_proxy_server_name == 'zt-vis-002-monitoring.lab.internal'
      - zt_vis_002_offline_package_bundle_source | length > 0
      - zt_vis_002_host_packages == ['podman', 'podman-compose', 'nginx']
    fail_msg: Explicit host-bootstrap, snapshot, private address, fixed package, and storage approvals are required

- name: Verify external proxy trust sources
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  register: zt_vis_002_proxy_sources
  loop:
    - "{{ zt_vis_002_proxy_client_ca_source }}"
    - "{{ zt_vis_002_proxy_server_certificate_source }}"
    - "{{ zt_vis_002_proxy_server_key_source }}"
  no_log: true

- name: Reject missing external proxy trust sources
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.size | int > 0
    fail_msg: Required external proxy trust material is unavailable
  loop: "{{ zt_vis_002_proxy_sources.results }}"
  no_log: true

- name: Wait for base-image initialization
  ansible.builtin.command:
    argv: [cloud-init, status, --wait]
  changed_when: false

- name: Discover the reviewed offline package bundle
  ansible.builtin.find:
    paths: "{{ zt_vis_002_offline_package_bundle_source }}"
    patterns: '*.deb'
    file_type: file
    recurse: false
  delegate_to: localhost
  become: false
  register: zt_vis_002_offline_packages

- name: Reject a missing offline package bundle
  ansible.builtin.assert:
    that:
      - zt_vis_002_offline_packages.matched | int >= 3
    fail_msg: The reviewed controller-side DEB bundle is missing

- name: Create the bounded target package staging directory
  ansible.builtin.file:
    path: /var/cache/snsd-zt-vis-002/packages
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Stage the reviewed offline package bundle
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/var/cache/snsd-zt-vis-002/packages/{{ item.path | basename }}"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ zt_vis_002_offline_packages.files | sort(attribute='path') }}"
  register: zt_vis_002_staged_packages

- name: Check for an existing package service-start policy
  ansible.builtin.stat:
    path: /usr/sbin/policy-rc.d
  register: zt_vis_002_policy_rc_d

- name: Reject an unreviewed existing package service-start policy
  ansible.builtin.assert:
    that:
      - not (zt_vis_002_policy_rc_d.stat.exists | default(false))
    fail_msg: Existing policy-rc.d requires separate review before offline package installation

- name: Install the fixed host package set from the offline bundle
  block:
    - name: Prevent transient package service startup
      ansible.builtin.copy:
        dest: /usr/sbin/policy-rc.d
        content: "#!/bin/sh\nexit 101\n"
        owner: root
        group: root
        mode: '0755'

    - name: Dry-run the complete staged package transaction
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/dpkg', '--dry-run', '--unpack'] + (zt_vis_002_staged_packages.results | map(attribute='dest') | list) }}"
      changed_when: false

    - name: Unpack only the complete staged package transaction
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/dpkg', '--unpack'] + (zt_vis_002_staged_packages.results | map(attribute='dest') | list) }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

    - name: Configure unpacked packages without network download
      ansible.builtin.command:
        argv:
          - /usr/bin/apt-get
          - --fix-broken
          - --no-download
          - --yes
          - install
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true
  always:
    - name: Remove the temporary package service-start policy
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent

- name: Verify approved host executables
  ansible.builtin.stat:
    path: "{{ item }}"
  register: zt_vis_002_host_executables
  loop:
    - /usr/bin/podman
    - /usr/bin/podman-compose
    - /usr/sbin/nginx

- name: Reject an incomplete host package installation
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.executable | default(false)
    fail_msg: An approved host executable is missing
  loop: "{{ zt_vis_002_host_executables.results }}"

- name: Remove the target-side offline package staging directory
  ansible.builtin.file:
    path: /var/cache/snsd-zt-vis-002/packages
    state: absent

- name: Inspect the approved data device before formatting
  ansible.builtin.command:
    argv:
      - /usr/bin/lsblk
      - --json
      - --bytes
      - --output
      - PATH,TYPE,SIZE,FSTYPE,MOUNTPOINTS
      - "{{ zt_vis_002_data_device }}"
  changed_when: false
  register: zt_vis_002_data_device_state

- name: Parse the approved data-device state
  ansible.builtin.set_fact:
    zt_vis_002_data_device_fact: "{{ (zt_vis_002_data_device_state.stdout | from_json).blockdevices[0] }}"

- name: Enforce the dedicated empty-or-package-owned data-device boundary
  ansible.builtin.assert:
    that:
      - (zt_vis_002_data_device_state.stdout | from_json).blockdevices | length == 1
      - zt_vis_002_data_device_fact.path == zt_vis_002_data_device
      - zt_vis_002_data_device_fact.type == 'disk'
      - zt_vis_002_data_device_fact.size | int == (zt_vis_002_data_device_expected_size_gib | int) * 1024 * 1024 * 1024
      - zt_vis_002_data_device_fact.children | default([]) | length == 0
      - zt_vis_002_data_device_fact.fstype in [none, '', 'ext4']
      - >-
        (zt_vis_002_data_device_fact.mountpoints | default([]) | reject('equalto', none) | list
        | difference([zt_vis_002_root]) | length) == 0
    fail_msg: Data device does not exactly match the Terraform-owned size and empty-or-package-owned boundary

- name: Read an existing data-device filesystem type
  ansible.builtin.command:
    argv: [/usr/sbin/blkid, -s, TYPE, -o, value, "{{ zt_vis_002_data_device }}"]
  changed_when: false
  failed_when: zt_vis_002_existing_filesystem.rc not in [0, 2]
  register: zt_vis_002_existing_filesystem

- name: Reject a foreign data-device filesystem
  ansible.builtin.assert:
    that:
      - zt_vis_002_existing_filesystem.rc == 2 or zt_vis_002_existing_filesystem.stdout == 'ext4'
    fail_msg: Existing data-device filesystem is not package-owned ext4

- name: Create the package-owned ext4 filesystem on the reviewed empty device
  ansible.builtin.command:
    argv: [/usr/sbin/mkfs.ext4, -F, -L, snsd_zt_vis_002_data, "{{ zt_vis_002_data_device }}"]
  when: zt_vis_002_existing_filesystem.rc == 2
  changed_when: true

- name: Read the package-owned filesystem UUID
  ansible.builtin.command:
    argv: [/usr/sbin/blkid, -s, UUID, -o, value, "{{ zt_vis_002_data_device }}"]
  changed_when: false
  register: zt_vis_002_data_uuid

- name: Reject an invalid filesystem UUID
  ansible.builtin.assert:
    that:
      - zt_vis_002_data_uuid.stdout is match('^[0-9a-fA-F-]{36}$')
    fail_msg: Package-owned filesystem UUID is unavailable

- name: Create the fixed data mount point
  ansible.builtin.file:
    path: "{{ zt_vis_002_root }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Persist the bounded data mount
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^UUID=[^ ]+\s+/opt/snsd-zt-vis-002\s+'
    line: "UUID={{ zt_vis_002_data_uuid.stdout }} {{ zt_vis_002_root }} ext4 defaults,nofail,nodev,nosuid 0 2"
    state: present
    create: false

- name: Check whether the bounded data volume is mounted
  ansible.builtin.command:
    argv: [/usr/bin/mountpoint, --quiet, "{{ zt_vis_002_root }}"]
  changed_when: false
  failed_when: zt_vis_002_mountpoint.rc not in [0, 32]
  register: zt_vis_002_mountpoint

- name: Mount the bounded data volume
  ansible.builtin.command:
    argv: [/usr/bin/mount, "{{ zt_vis_002_root }}"]
  when: zt_vis_002_mountpoint.rc == 32
  changed_when: true

- name: Verify the bounded data mount
  ansible.builtin.command:
    argv: [/usr/bin/findmnt, --noheadings, --output, "FSTYPE,OPTIONS", "{{ zt_vis_002_root }}"]
  changed_when: false
  register: zt_vis_002_mount_validation

- name: Reject a missing or weak data mount
  ansible.builtin.assert:
    that:
      - zt_vis_002_mount_validation.stdout is search('^ext4 ')
      - zt_vis_002_mount_validation.stdout is search('(^|,)nodev(,|$)')
      - zt_vis_002_mount_validation.stdout is search('(^|,)nosuid(,|$)')
    fail_msg: Dedicated data mount is missing ext4, nodev, or nosuid

- name: Create the private proxy trust directory
  ansible.builtin.file:
    path: /etc/nginx/zt-vis-002
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install public proxy trust material
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {src: "{{ zt_vis_002_proxy_client_ca_source }}", dest: /etc/nginx/zt-vis-002/client-ca.crt}
    - {src: "{{ zt_vis_002_proxy_server_certificate_source }}", dest: /etc/nginx/zt-vis-002/server.crt}
  no_log: true
  notify: Validate and reload ZT-VIS-002 nginx

- name: Install the private proxy server key
  ansible.builtin.copy:
    src: "{{ zt_vis_002_proxy_server_key_source }}"
    dest: /etc/nginx/zt-vis-002/server.key
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Validate and reload ZT-VIS-002 nginx

- name: Remove the nginx default listener
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Validate and reload ZT-VIS-002 nginx

- name: Render the private mTLS reverse proxy
  ansible.builtin.template:
    src: nginx-zt-vis-002.conf.j2
    dest: /etc/nginx/sites-available/zt-vis-002
    owner: root
    group: root
    mode: '0640'
  notify: Validate and reload ZT-VIS-002 nginx

- name: Enable only the package-owned nginx listener
  ansible.builtin.file:
    src: /etc/nginx/sites-available/zt-vis-002
    dest: /etc/nginx/sites-enabled/zt-vis-002
    state: link
  notify: Validate and reload ZT-VIS-002 nginx

- name: Validate the private proxy before first startup
  ansible.builtin.command:
    argv: [/usr/sbin/nginx, -t]
  changed_when: false

- name: Enable and start the validated private proxy
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Apply pending validated proxy updates
  ansible.builtin.meta: flush_handlers
