# NON-PRODUCTION EXAMPLE ONLY
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus-self-placeholder
    static_configs:
      - targets: ["<prometheus-server>"]

  - job_name: node-exporter-placeholder
    static_configs:
      - targets: ["<node-exporter-target>"]

  - job_name: mariadb-exporter-placeholder
    static_configs:
      - targets: ["<mariadb-exporter-target>"]

  - job_name: nginx-exporter-placeholder
    static_configs:
      - targets: ["<nginx-exporter-target>"]

  - job_name: blackbox-exporter-placeholder
    static_configs:
      - targets: ["<blackbox-exporter-target>"]

  - job_name: kubernetes-service-discovery-placeholder
    # Discovery placeholder: <kubernetes-service-discovery-placeholder>
    kubernetes_sd_configs:
      - role: endpoints
