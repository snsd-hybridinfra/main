# NON-PRODUCTION EXAMPLE - static validation input only.
# Include only after service-specific review. This file defines no listener, domain, upstream, certificate, or key.

server_tokens off;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "<content-security-policy-placeholder>" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "<permissions-policy-placeholder>" always;

