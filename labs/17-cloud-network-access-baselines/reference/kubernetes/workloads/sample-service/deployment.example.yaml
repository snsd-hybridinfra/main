# NON-PRODUCTION EXAMPLE - static validation input only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service-placeholder
  namespace: snsd-example
  labels:
    app: sample-service-placeholder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-service-placeholder
  template:
    metadata:
      labels:
        app: sample-service-placeholder
    spec:
      serviceAccountName: snsd-example-application
      automountServiceAccountToken: false
      hostNetwork: false
      containers:
        - name: sample-service-placeholder
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

